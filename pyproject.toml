[project]
name = "shadow-cogs"
version = "0.1.0"
description = "Cogs for Red-DiscordBot by Shadow Templars"
requires-python = ">=3.11"
license = "MIT"

[dependency-groups]
dev = [
    "aiohttp>=3.9",
    "aiomqtt==2.5.1",
    "httpx>=0.28.0",
    "openai>=1.60.0,<2.0.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.14",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["aichat", "healthcheck", "mqttbridge"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
]
