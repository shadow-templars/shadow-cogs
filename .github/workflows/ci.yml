name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0

      - name: Lint
        run: uv run --group dev ruff check .

      - name: Format
        run: uv run --group dev ruff format --check .

      - name: Test
        run: uv run --group dev pytest --cov
